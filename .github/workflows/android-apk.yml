name: Build Android test APK (v1.0.4 in-app privacy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android test APK with RevenueCat Test Store
        env:
          REVENUECAT_TEST_API_KEY: ${{ secrets.REVENUECAT_TEST_API_KEY }}
        run: |
          set -eu
          if [ -z "${REVENUECAT_TEST_API_KEY:-}" ]; then
            echo '::error::GitHub Secret REVENUECAT_TEST_API_KEY is missing'; exit 1
          fi
          case "$REVENUECAT_TEST_API_KEY" in
            test_*) ;;
            *) echo '::error::Use the RevenueCat test_ Public SDK key for this debug APK'; exit 1 ;;
          esac
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/android@8.6.0 @capacitor/share@8 @capacitor-community/admob@8.2.1 @revenuecat/purchases-capacitor@13.7.6 esbuild@0.25
          mkdir -p www
          cp index.html privacy.html manifest.json sw.js icon-192.png icon-512.png www/
          cat > native-entry.js <<'EOF'
          import { Share } from '@capacitor/share';
          import { Purchases, LOG_LEVEL } from '@revenuecat/purchases-capacitor';
          import { SystemBars, SystemBarsStyle } from '@capacitor/core';
          import { AdMob, AdmobConsentStatus, BannerAdSize, BannerAdPosition } from '@capacitor-community/admob';

          // Android 16+ 対応：ステータスバーのアイコンを明るく保つ。
          document.body.classList.add('native-app');
          SystemBars.setStyle({ style: SystemBarsStyle.Dark })
            .catch(error => console.warn('システムバー設定をスキップ', error));

          const RC_TEST_API_KEY = '__REVENUECAT_TEST_KEY_PLACEHOLDER__';
          const gameUrl = 'https://zakky0424.github.io/gyakushiji-panic/';
          const bannerId = 'ca-app-pub-3940256099942544/6300978111';
          const fullAdId = 'ca-app-pub-3940256099942544/1033173712';

          document.addEventListener('click', async (event) => {
            if (!event.target.closest?.('#share')) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            event.stopPropagation();
            const score = document.getElementById('final-score').textContent;
            const misses = document.getElementById('final-miss').textContent;
            const daily = document.getElementById('final-unit').textContent.includes('/');
            const text = `⚡逆指示パニック\n${daily ? '今日の5問' : '30秒チャレンジ'}: ${daily ? score + '/5' : score}問正解！\nミス: ${misses}回\nあなたは何問できる？`;
            try {
              await Share.share({ title: '逆指示パニック', text, url: gameUrl, dialogTitle: '結果をシェア' });
            } catch (error) {
              console.info('共有がキャンセルされたか失敗しました', error);
            }
          }, true);

          let adFree = false;
          let billingVerified = false;
          let purchaseReady = false;
          let purchasePackage = null;
          let purchaseBusy = false;
          let adsReady = false;
          let bannerCreated = false;
          let bannerVisible = false;
          let interstitialLoaded = false;
          let interstitialLoadPromise = null;
          let interstitialShowing = false;
          let interstitialPending = false;
          let interstitialTimer = null;
          let lastInterstitialAttempt = 0;
          let completedSinceAd = 0;
          let previousScreen = 'home';
          let bannerQueue = Promise.resolve();

          function screen() {
            return ['home', 'game', 'result'].find((id) => !document.getElementById(id).hidden);
          }

          // A failed initial preload must not permanently disable subsequent interstitials.
          async function prepareFullAd() {
            if (!adsReady || adFree || interstitialShowing) return false;
            if (interstitialLoaded) return true;
            if (interstitialLoadPromise) return interstitialLoadPromise;
            if (Date.now() - lastInterstitialAttempt < 1500) return false;
            lastInterstitialAttempt = Date.now();
            interstitialLoadPromise = (async () => {
              try {
                await AdMob.prepareInterstitial({ adId: fullAdId, isTesting: true });
                interstitialLoaded = true;
                return true;
              } catch (error) {
                console.warn('テスト全画面広告の読み込みに失敗（次に再試行）', error);
                return false;
              } finally {
                interstitialLoadPromise = null;
              }
            })();
            return interstitialLoadPromise;
          }

          // Show only at a result screen, never during a round. A missed ad remains pending.
          function scheduleFullAd(delay = 1200) {
            if (!adsReady || adFree || !interstitialPending || interstitialShowing ||
                interstitialTimer !== null || screen() !== 'result') return;
            interstitialTimer = setTimeout(async () => {
              interstitialTimer = null;
              if (!interstitialPending || adFree || screen() !== 'result') return;
              const ready = await prepareFullAd();
              if (!interstitialPending || adFree || screen() !== 'result') return;
              if (!ready) {
                scheduleFullAd(2400);
                return;
              }
              interstitialLoaded = false;
              interstitialShowing = true;
              try {
                await AdMob.showInterstitial();
                interstitialPending = false;
                completedSinceAd = 0;
              } catch (error) {
                console.warn('全画面広告の表示に失敗（次の結果画面でも再試行）', error);
              } finally {
                interstitialShowing = false;
                if (!adFree) prepareFullAd();
                if (interstitialPending && screen() === 'result') scheduleFullAd(2400);
              }
            }, delay);
          }

          function updateBanner() {
            bannerQueue = bannerQueue.then(async () => {
              if (!adsReady) return;
              const show = !adFree && screen() === 'home';
              if (show && !bannerVisible) {
                if (bannerCreated) {
                  await AdMob.resumeBanner();
                } else {
                  await AdMob.showBanner({
                    adId: bannerId, adSize: BannerAdSize.BANNER,
                    position: BannerAdPosition.BOTTOM_CENTER,
                    isTesting: true
                  });
                  bannerCreated = true;
                }
                bannerVisible = true;
                document.body.classList.add('native-banner');
              } else if (!show && bannerVisible) {
                await AdMob.hideBanner();
                bannerVisible = false;
                document.body.classList.remove('native-banner');
              }
            }).catch((error) => console.warn('バナー広告の切替失敗', error));
          }

          function onScreenChanged() {
            const now = screen();
            if (now === previousScreen) return;
            previousScreen = now;
            updateBanner();
            if (now === 'game') {
              // Retry preloading in case the first attempt failed.
              prepareFullAd();
            }
            if (now === 'result' && !adFree) {
              completedSinceAd += 1;
              if (completedSinceAd >= 3) interstitialPending = true;
              if (interstitialPending) scheduleFullAd();
            }
          }

          async function startDemoAds() {
            if (!billingVerified || adFree) return;
            try {
              let consent = await AdMob.requestConsentInfo();
              if (consent.isConsentFormAvailable && consent.status === AdmobConsentStatus.REQUIRED) {
                consent = await AdMob.showConsentForm();
              }
              if (!consent.canRequestAds) {
                console.info('同意状態により広告リクエストを行いません');
                return;
              }
              await AdMob.initialize();
              adsReady = true;
              const observer = new MutationObserver(onScreenChanged);
              for (const id of ['home', 'game', 'result']) {
                observer.observe(document.getElementById(id), { attributes: true, attributeFilter: ['hidden'] });
              }
              updateBanner();
              prepareFullAd();
            } catch (error) {
              console.warn('テスト広告の初期化失敗（ゲームはそのまま遊べます）', error);
            }
          }
          const buyButton = document.getElementById('purchase-ads');
          const restoreButton = document.getElementById('restore-ads');
          const purchaseStatus = document.getElementById('purchase-status');

          function markPurchaseStatus(message) { purchaseStatus.textContent = message; }
          function applyCustomerInfo(customerInfo) {
            billingVerified = true;
            adFree = Boolean(customerInfo?.entitlements?.active?.ad_free);
            if (adFree) {
              interstitialPending = false;
              if (interstitialTimer !== null) {
                clearTimeout(interstitialTimer);
                interstitialTimer = null;
              }
            }
            buyButton.hidden = adFree;
            restoreButton.hidden = adFree;
            markPurchaseStatus(adFree
              ? '広告非表示が有効になりました。ありがとうございました！'
              : 'テスト購入は実際の決済ではありません。');
            updateBanner();
          }

          async function initPurchases() {
            try {
              await Purchases.setLogLevel({ level: LOG_LEVEL.WARN });
              await Purchases.configure({ apiKey: RC_TEST_API_KEY });
              const { customerInfo } = await Purchases.getCustomerInfo();
              applyCustomerInfo(customerInfo);
              const { current } = await Purchases.getOfferings();
              purchasePackage = current?.availablePackages?.find((item) =>
                item.product?.identifier === 'lifetime') || current?.lifetime || null;
              purchaseReady = Boolean(purchasePackage);
              buyButton.disabled = !purchaseReady;
              restoreButton.disabled = false;
              if (!purchaseReady && !adFree) {
                markPurchaseStatus('テスト商品を読み込めませんでした。通信状態や商品設定をご確認ください。');
              }
            } catch (error) {
              // Billing unverified => no ads, preventing a paid user from seeing ads on a transient error.
              console.warn('RevenueCat の初期化・読込に失敗', error);
              if (!billingVerified) {
                markPurchaseStatus('購入情報に接続できません。ネット接続を確認してください。');
              }
            }
          }

          buyButton.addEventListener('click', async () => {
            if (purchaseBusy || !purchaseReady || adFree) return;
            purchaseBusy = true;
            buyButton.disabled = true;
            markPurchaseStatus('テスト購入画面を開いています…');
            try {
              const { customerInfo } = await Purchases.purchasePackage({ aPackage: purchasePackage });
              applyCustomerInfo(customerInfo);
              if (!adFree) markPurchaseStatus('購入を確認できませんでした。再度お試しください。');
            } catch (error) {
              if (error?.userCancelled) markPurchaseStatus('購入をキャンセルしました。');
              else {
                console.warn('テスト購入に失敗', error);
                markPurchaseStatus('購入に失敗しました。通信状況を確認してください。');
              }
            } finally {
              purchaseBusy = false;
              buyButton.disabled = adFree || !purchaseReady;
            }
          });

          restoreButton.addEventListener('click', async () => {
            if (purchaseBusy) return;
            purchaseBusy = true;
            restoreButton.disabled = true;
            markPurchaseStatus('購入状態を復元しています…');
            try {
              const { customerInfo } = await Purchases.restorePurchases();
              applyCustomerInfo(customerInfo);
              if (!adFree) markPurchaseStatus('このユーザーの購入履歴は見つかりませんでした。');
            } catch (error) {
              console.warn('購入の復元に失敗', error);
              markPurchaseStatus('復元できませんでした。通信状態を確認してください。');
            } finally {
              purchaseBusy = false;
              restoreButton.disabled = false;
            }
          });

          window.addEventListener('load', () => setTimeout(async () => {
            // RevenueCat purchase status must be checked before initializing advertisements.
            await initPurchases();
            await startDemoAds();
          }, 600));
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import os, json
          p = Path('native-entry.js')
          text = p.read_text(encoding='utf-8')
          placeholder = "'__REVENUECAT_TEST_KEY_PLACEHOLDER__'"
          assert text.count(placeholder) == 1
          text = text.replace(placeholder, json.dumps(os.environ['REVENUECAT_TEST_API_KEY']))
          p.write_text(text, encoding='utf-8')
          PY
          npx esbuild native-entry.js --bundle --format=iife --platform=browser --target=chrome100 --outfile=www/native-entry.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text()
          assert '</body>' in s
          # 共有機能・広告処理は変更せず、Android APKでの表示だけ補正する。
          assert s.count('無料試作版 v0.7') == 1
          assert s.count('広告なし（試作中）') == 1
          s = s.replace('無料試作版 v0.7', 'テスト版 v1.0.4')
          s = s.replace('広告なし（試作中）', 'テスト広告・テスト課金（実際の請求なし）')
          # Native WebView must use the bundled policy instead of opening Chrome.
          privacy_web_link = 'href="https://zakky0424.github.io/gyakushiji-panic/privacy.html" target="_blank" rel="noopener noreferrer"'
          assert s.count(privacy_web_link) == 1, 'プライバシーポリシーのリンクが見つかりません'
          s = s.replace(privacy_web_link, 'href="./privacy.html"', 1)
          assert s.count('<div class="stats-strip">') == 1
          purchase_ui = ('''
          <div id="purchase-panel" class="purchase-panel">
            <button id="purchase-ads" class="purchase-button" type="button" disabled>広告を非表示にする（テスト購入）</button>
            <button id="restore-ads" class="restore-button" type="button" disabled>購入を復元する</button>
            <p id="purchase-status" class="purchase-status" aria-live="polite">購入情報を確認しています…</p>
          </div>
          ''')
          # Keep scores visible before purchase controls, above the fixed native banner.
          # The stats strip contains nested tags, so match through the next section boundary.
          marker = '<p class="disclaimer">'
          assert s.count(marker) == 1
          s = s.replace(marker, purchase_ui + marker, 1)
          css = '''
          <style>
            .purchase-panel {margin: 0 0 15px; padding: 13px; border: 1px solid #394467; border-radius: 16px; background: #181d35; text-align: center}
            .purchase-button {width: 100%; border: 1px solid #927aff; background: #493c87; padding: 12px 10px; color: white; border-radius: 12px; font-size: 13px; font-weight: 800}
            .restore-button {border: 0; background: none; color: #bfb2ff; padding: 12px; font-size: 12px; font-weight: 700}
            .purchase-status {font-size: 11px; color: #bec6e8; margin: 4px 0 0; line-height: 1.5}
            /* Keep header title on one line on narrow phones. */
            body.native-app .site-header { flex-wrap: wrap; column-gap: 7px; row-gap: 7px; }
            body.native-app .brand { min-width: 0; flex: 0 1 auto; gap: 7px; }
            body.native-app .brand-icon { width: 36px; height: 36px; font-size: 26px; flex: 0 0 auto; }
            body.native-app .brand-title { white-space: nowrap; font-size: clamp(15px, 4.3vw, 19px); letter-spacing: -.06em; }
            body.native-app .brand-sub { font-size: 10px; }
            body.native-app .version { flex: 0 0 auto; margin-left: auto; padding: 6px 8px; font-size: 10px; }
            body.native-app #home .stats-strip { margin-bottom: 14px; }
            body.native-app #home .purchase-panel { margin-top: 0; }
            /* Allow content at the bottom of the page to scroll above the fixed banner. */
            /* v1.0.2 compact layout, preserved in v1.0.3. */
            body.native-app #home .hero { padding-top: 8px; padding-bottom: 8px; }
            body.native-app #home .hero h1 { font-size: clamp(40px, 10vw, 54px); line-height: 1.08; margin: 10px 0; }
            body.native-app #home .hero p { line-height: 1.65; margin-bottom: 10px; }
            body.native-app #home .example { padding: 10px 14px; }
            body.native-app #home .mode-grid { gap: 9px; margin-bottom: 12px; }
            body.native-app #home .mode-card { min-height: 71px; padding: 11px 14px; }
            body.native-app #home .stats-strip { padding: 10px 0; margin-bottom: 9px; }
            body.native-app #home .purchase-panel { padding: 9px; margin-bottom: 10px; }
            body.native-app #home .purchase-button { padding: 10px 8px; }
            body.native-app #home .restore-button { padding: 8px 10px; }
            body.native-app.native-banner #home { padding-bottom: 130px; }
            /* Capacitor 8 SystemBars のセーフエリア値。通常のWeb/PWA版には影響しない */
            body.native-app .shell {
              padding-top: calc(19px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
              padding-bottom: calc(18px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
            }
            body.native-app.native-banner .shell {
              padding-bottom: calc(85px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
            }
          </style>
          '''
          s = s.replace('</body>', css + '<script src="./native-entry.js"></script></body>', 1)
          p.write_text(s)

          # Bundle the privacy page for offline use, without replacing the home cache with it.
          sw_path = Path('www/sw.js')
          sw = sw_path.read_text()
          assert "const CACHE_NAME = 'gyakushiji-panic-pwa-v0.7';" in sw
          assert "'./index.html'," in sw
          assert "cache.put('./', copy)" in sw
          sw = sw.replace("const CACHE_NAME = 'gyakushiji-panic-pwa-v0.7';", "const CACHE_NAME = 'gyakushiji-panic-pwa-v0.8';", 1)
          sw = sw.replace("'./index.html',", "'./index.html',\n  './privacy.html',", 1)
          sw = sw.replace("cache.put('./', copy)", "cache.put(req, copy)", 1)
          sw_path.write_text(sw)
          PY
          npx cap init "Gyakushiji Panic" "io.github.zakky0424.gyakushijipanic" --web-dir www
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          metadata = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
          s, count = re.subn(r'(<application\b[^>]*>)', lambda m: m.group(1) + '\n        ' + metadata, s, count=1)
          assert count == 1, 'AndroidManifestのapplication要素が見つかりません'
          p.write_text(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gyakushiji-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
